name: Deploy Backend to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '!backend/**/*.md'
      - '!backend/.gitignore'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Railway CLI
        run: npm install -g @railway/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Railway Login
        run: railway login --token ${{ secrets.RAILWAY_TOKEN }}

      - name: Railway Deploy
        run: |
          railway up --service chatgpt-images-api --project ${{ secrets.RAILWAY_PROJECT_ID }} --token ${{ secrets.RAILWAY_TOKEN }}
        working-directory: backend
        env:
          DUOMI_API_KEY: ${{ secrets.DUOMI_API_KEY }}
          WIKE_API_KEY: ${{ secrets.WIKE_API_KEY }}
          NODE_ENV: production

      - name: Get Railway URL
        id: railway_url
        run: |
          echo "url=$(railway status --token ${{ secrets.RAILWAY_TOKEN }} | grep -o 'https://[^ ]*\.up\.railway\.app' || echo '')" >> $GITHUB_OUTPUT

      - name: Display Deployment URL
        run: |
          echo "Railway 部署完成"
          echo "URL: ${{ steps.railway_url.outputs.url }}"
          echo "请更新前端 .env.production 中的 VITE_API_URL"

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "✅ 后端部署成功！"
          else
            echo "❌ 后端部署失败"
          fi
